name: Frontend Main Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check npm
        run: |
          npm ci
          npm run lint
          npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          
  bump-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout infra repository
        uses: actions/checkout@v6
        with:
          repository: amysyutin/py_wallet-infra
          ref: main
          token: ${{ secrets.GITOPS_BOT_TOKEN }}
          path: infra

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Bump frontend image tag
        run: |
          cd infra/manifests/frontend
          kustomize edit set image \
            ghcr.io/amysyutin/py_wallet-front=ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Commit, push, and open deploy PR
        env:
          GH_TOKEN: ${{ secrets.GITOPS_BOT_TOKEN }}
          DEPLOY_BRANCH: deploy/py-wallet-front/${{ github.sha }}-${{ github.run_attempt }}
        run: |
          cd infra
          git config user.name "deploybot"
          git config user.email "deploybot@users.noreply.github.com"
          git switch -c "${DEPLOY_BRANCH}"
          git add manifests/frontend/kustomization.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "deploy(frontend): bump image to ${{ github.sha }}"
          git push --set-upstream origin "${DEPLOY_BRANCH}"
          pr_url=""
          for attempt in 1 2 3; do
            if pr_url=$(gh pr create \
              --repo amysyutin/py_wallet-infra \
              --base main \
              --head "${DEPLOY_BRANCH}" \
              --title "deploy(frontend): bump image to ${{ github.sha }}" \
              --body "Automated image bump from amysyutin/py_wallet-front@${{ github.sha }}."); then
              break
            fi

            echo "Deploy PR creation attempt ${attempt}/3 failed; checking whether GitHub created it anyway." >&2
            pr_url=$(gh pr list \
              --repo amysyutin/py_wallet-infra \
              --state open \
              --head "${DEPLOY_BRANCH}" \
              --json url \
              --jq '.[0].url' 2>/dev/null) || pr_url=""
            [[ -n "${pr_url}" ]] && break
            [[ "${attempt}" -lt 3 ]] && sleep $((attempt * 5))
          done

          if [[ -z "${pr_url}" ]]; then
            echo "Unable to create or find deploy PR after 3 attempts." >&2
            git push origin --delete "${DEPLOY_BRANCH}"
            exit 1
          fi
          echo "Opened ${pr_url}"
          gh pr list \
            --repo amysyutin/py_wallet-infra \
            --state open \
            --base main \
            --json number,headRefName \
            --jq ".[] | select((.headRefName | startswith(\"deploy/py-wallet-front/\")) and .headRefName != \"${DEPLOY_BRANCH}\") | .number" \
          | while read -r pr_number; do
              gh pr close \
                --repo amysyutin/py_wallet-infra \
                "${pr_number}" \
                --comment "Superseded by ${pr_url}."
            done
