name: Frontend Main Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check npm
        run: |
          npm ci
          npm run lint
          npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          
  bump-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout infra repository
        uses: actions/checkout@v6
        with:
          repository: amysyutin/py_wallet-infra
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Bump frontend image tag
        run: |
          cd infra/manifests/frontend
          kustomize edit set image \
            ghcr.io/amysyutin/py_wallet-front=ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Commit and push
        run: |
          cd infra
          git config user.name "deploybot"
          git config user.email "deploybot@users.noreply.github.com"
          git add manifests/frontend/kustomization.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "deploy(frontend): bump image to ${{ github.sha }}"
          git push origin main
